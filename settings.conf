# Minkraft settings
# Edit any value and relaunch the game. Lines starting with # are comments.

# ---------- Window ----------
# Window size in pixels.
windowWidth = 1280
windowHeight = 720

# Vertical sync: 1 = cap to monitor refresh, 0 = uncapped (use with maxFps).
windowVsync = 1

# Borderless window: 1 = borderless fullscreen at desktop resolution, 0 = windowed.
windowBorderless = 0

# ---------- Graphics ----------
# Number of chunks drawn in each direction around the player. Raise for a
# further view, lower for better performance on weak GPUs.
renderDistance = 72

# Field of view in degrees.
fov = 70

# Max frames per second when windowVsync=0 (0 = unlock to hardware limit).
maxFps = 0

# Texture anisotropy (filter quality): 1, 2, 4, 8 or 16.
maxAnisotropy = 8

# Chunks remeshed per frame while new terrain appears (higher = faster load,
# but may cause a brief hitch when chunks are generated).
meshBudget = 32

# ---------- Gameplay ----------
# Distance in blocks at which you can break/place blocks.
reach = 6

# Base seconds to destroy a block of hardness 1. Hardness 2 = 2x, 3 = 3x, ...
# Default hardness: most blocks 1, stone 3 (so stone takes 6 s).
breakTime = 2.0

# Minimum seconds between placing blocks while holding RMB.
placeDelay = 0.125
