# Minkraft world generation rules. Edit any value and relaunch the game.
# ----------------------------------------------------------------

# Base rolling ground: land height = baseHeight + noise * heightAmp.
baseHeight = 16
heightAmp = 26
terrainScale = 0.010
terrainOctaves = 4

# Extra bumpy hills layered on top of the rolling ground.
hillScale = 0.030
hillAmp = 7
hillOctaves = 3

# Tall mountain ranges (noise above mountainThreshold grows into peaks).
mountainThreshold = 0.50
mountainAmp = 55
mountainScale = 0.005
mountainOctaves = 4

# Caves: 3D noise above this value gets carved out (lower = more caves).
caveThreshold = 0.72

# Surface biomes.
seaLevel = 24
snowHeight = 48
beachLevel = 25

# Trees.
treeChancePct = 5
treeMinHeight = 30
treeMaxHeight = 48
